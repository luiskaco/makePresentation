<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guía Práctica de Herramientas de IA - Orange LATAM</title>
  <meta name="description" content="Guía interactiva de herramientas de IA de Orange LATAM. Conoce lo que ya tienes disponible y cómo implementarlo.">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Estilos del Proyecto -->
  <link rel="stylesheet" href="styles.css?v=3">

</head>
<body>

  <!-- Header Global / Controles de Vista -->
  <header class="global-header">
    <div class="logo-area">
      <img src="assets/image3.png" alt="Orange LATAM" class="header-logo">
    </div>
    <nav class="view-controls">
      <button id="btn-slide-mode" class="nav-btn active">
        <svg class="icon" viewBox="0 0 24 24" width="18" height="18">
          <rect x="3" y="3" width="18" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
          <line x1="9" y1="3" x2="9" y2="21" stroke="currentColor" stroke-width="2"/>
        </svg>
        Modo Presentación
      </button>
      <button id="btn-dashboard-mode" class="nav-btn">
        <svg class="icon" viewBox="0 0 24 24" width="18" height="18">
          <rect x="3" y="3" width="7" height="9" fill="none" stroke="currentColor" stroke-width="2"/>
          <rect x="14" y="3" width="7" height="5" fill="none" stroke="currentColor" stroke-width="2"/>
          <rect x="3" y="16" width="7" height="5" fill="none" stroke="currentColor" stroke-width="2"/>
          <rect x="14" y="12" width="7" height="9" fill="none" stroke="currentColor" stroke-width="2"/>
        </svg>
        Dashboard / Directorio
      </button>
    </nav>
  </header>

  <!-- MODO PRESENTACIÓN -->
  <main id="presentation-container" class="presentation-container">
    <div class="slide-viewport">
      <div id="slide-wrapper" class="slide-wrapper">
        <!-- Las diapositivas se renderizarán dinámicamente aquí -->
      </div>
    </div>

    <!-- Controles Flotantes Diapositivas -->
    <div class="slide-navigation">
      <button id="btn-prev-slide" class="nav-arrow-btn" aria-label="Diapositiva Anterior">
        <svg viewBox="0 0 24 24" width="24" height="24">
          <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z" fill="currentColor"/>
        </svg>
      </button>
      <div id="slide-indicator" class="slide-indicator">1 / 19</div>
      <button id="btn-next-slide" class="nav-arrow-btn" aria-label="Siguiente Diapositiva">
        <svg viewBox="0 0 24 24" width="24" height="24">
          <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z" fill="currentColor"/>
        </svg>
      </button>
    </div>

    <!-- Barra de progreso de diapositivas -->
    <div class="progress-bar-container">
      <div id="slide-progress" class="slide-progress" style="width: 5.26%;"></div>
    </div>
  </main>

  <!-- MODO DASHBOARD -->
  <main id="dashboard-container" class="dashboard-container hidden">
    <!-- Panel de filtros superior -->
    <section class="dashboard-filter-panel">
      <div class="search-box-wrapper">
        <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18">
          <circle cx="11" cy="11" r="8" fill="none" stroke="currentColor" stroke-width="2"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65" stroke="currentColor" stroke-width="2"/>
        </svg>
        <input type="text" id="dashboard-search" placeholder="Buscar herramienta por nombre, uso, descripción..." autocomplete="off">
      </div>
      <div class="filters-scroll">
        <div id="category-filters" class="category-filters">
          <button class="filter-btn active" data-category="ALL">Todos</button>
          <button class="filter-btn" data-category="SEO">SEO</button>
          <button class="filter-btn" data-category="VIDEO">Video</button>
          <button class="filter-btn" data-category="EDICIÓN">Edición Video</button>
          <button class="filter-btn" data-category="AUDIO">Audio</button>
          <button class="filter-btn" data-category="IMÁGENES">Imágenes</button>
          <button class="filter-btn" data-category="DISEÑO UI">Diseño UI</button>
          <button class="filter-btn" data-category="ASISTENTES">Asistentes</button>
        </div>
        <div id="license-filters" class="license-filters">
          <button class="filter-license-btn active" data-license="ALL">Cualquiera</button>
          <button class="filter-license-btn" data-license="included">✓ Ya lo tienes</button>
          <button class="filter-license-btn" data-license="independent">★ Independiente</button>
        </div>
      </div>
    </section>

    <!-- Listado de herramientas -->
    <section id="dashboard-grid" class="dashboard-grid">
      <!-- Las herramientas filtradas se renderizarán dinámicamente aquí -->
    </section>
  </main>

  <!-- MODAL / LIGHTBOX DE VIDEOS TUTORIALES -->
  <div id="video-modal" class="video-modal hidden" aria-hidden="true" role="dialog">
    <div class="video-modal-overlay" id="video-modal-overlay"></div>
    <div class="video-modal-content">
      <button id="btn-close-modal" class="btn-close-modal" aria-label="Cerrar Tutorial">
        <svg viewBox="0 0 24 24" width="24" height="24">
          <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" fill="currentColor"/>
        </svg>
      </button>
      <div class="video-iframe-container">
        <iframe id="video-iframe" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
      </div>
      <h3 id="modal-tool-name" class="modal-tool-name">Tutorial de Herramienta</h3>
    </div>
  </div>

  <!-- Scripts -->
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
